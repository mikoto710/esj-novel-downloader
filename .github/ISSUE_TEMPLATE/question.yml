name: 使用问题
description: 咨询脚本使用相关问题
title: "[Question]: "
labels:
    - question
body:
    - type: markdown
      attributes:
          value: |
              感谢你提出问题。请说明你想完成什么以及目前遇到的疑问，以便其他人快速理解你的使用场景。
              如果现有功能没有按预期工作，请改用 Bug 反馈模板；如果希望增加或改进功能，请改用功能建议模板。
              请勿上传完整小说内容、登录信息、Cookie、访问令牌或其他敏感数据。

    - type: checkboxes
      id: checks
      attributes:
          label: 提交前确认
          options:
              - label: 我已查看 README 并搜索过现有 Issue。
                required: true
              - label: 这是使用问题，而不是可复现的 Bug 或功能需求。
                required: true
              - label: 我已移除敏感信息和受版权保护的完整内容。
                required: true

    - type: dropdown
      id: question_area
      attributes:
          label: 问题范围
          description: 请选择最接近的问题范围。
          options:
              - 安装或更新
              - 下载流程
              - 导出文件
              - 正文图片
              - 设置、缓存或下载记录
              - 页面或站点兼容
              - 其他
      validations:
          required: true

    - type: textarea
      id: question_details
      attributes:
          label: 具体问题
          description: 请说明你想完成什么、目前不清楚或卡住的地方，以及已经尝试过的方法。
          placeholder: |
              我想完成：
              目前不清楚或卡住的地方：
              已经尝试：
      validations:
          required: true

    - type: input
      id: userscript_version
      attributes:
          label: 脚本版本
          description: 可在脚本管理器或下载面板中查看。
          placeholder: 例如：1.4.6-beta.4
      validations:
          required: true

    - type: textarea
      id: additional_context
      attributes:
          label: 环境与补充信息
          description: 如有需要，可补充浏览器、脚本管理器、相关页面或设置，并将截图拖放到此处。请移除敏感信息和受版权保护的完整内容。
