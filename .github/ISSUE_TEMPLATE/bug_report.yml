name: Bug 反馈
description: 反馈 ESJ Novel Downloader 中可复现的 Bug
title: "[Bug]: "
labels:
    - bug
body:
    - type: markdown
      attributes:
          value: |
              感谢你提交 Bug 反馈。请尽量提供完整信息，以便快速复现和定位问题。
              请勿上传完整小说内容、登录信息、Cookie、访问令牌或其他敏感数据。

    - type: checkboxes
      id: checks
      attributes:
          label: 提交前确认
          options:
              - label: 我已搜索现有 Issue，并使用当前可用的最新版本进行测试。
                required: true
              - label: 我确认这是 Bug 反馈，而不是使用问题或功能需求。
                required: true
              - label: 我已移除敏感信息和受版权保护的完整内容。
                required: true

    - type: markdown
      attributes:
          value: |
              ## 问题详情

    - type: textarea
      id: problem_description
      attributes:
          label: 问题描述
          description: 请只报告一个问题，并说明实际行为、预期行为和出现频率。
          placeholder: |
              实际发生：
              预期行为：
              出现频率：
      validations:
          required: true

    - type: textarea
      id: reproduction_steps
      attributes:
          label: 复现步骤
          description: 如果可以稳定复现，请按顺序提供操作步骤；如果无法稳定复现，可以留空，并在问题描述中说明出现频率。
          placeholder: |
              1. 打开……页面
              2. 将……设置为……
              3. 点击……
              4. 观察到……

    - type: markdown
      attributes:
          value: |
              ## 分类与环境

    - type: dropdown
      id: affected_feature
      attributes:
          label: 涉及功能
          description: 请选择最接近的问题范围。
          options:
              - 全本下载
              - 单章导出
              - 导出文件（EPUB、HTML 或 TXT）
              - 正文图片
              - 缓存或任务恢复
              - 下载记录
              - 设置或页面界面
              - 安装或更新
              - 其他
      validations:
          required: true

    - type: input
      id: userscript_version
      attributes:
          label: 脚本版本
          description: 可在脚本管理器或下载面板中查看。
          placeholder: 例如：1.4.6-beta.4
      validations:
          required: true

    - type: input
      id: browser
      attributes:
          label: 浏览器
          placeholder: 例如：Chrome 140、Firefox 142
      validations:
          required: true

    - type: input
      id: userscript_manager
      attributes:
          label: 脚本管理器
          placeholder: 例如：Tampermonkey 5.x、Violentmonkey 2.x
      validations:
          required: true

    - type: markdown
      attributes:
          value: |
              ## 场景补充

    - type: textarea
      id: related_context
      attributes:
          label: 相关页面与场景
          description: 下载问题请补充书籍或章节链接、下载范围、导出格式、正文图片设置、缓存状态及阅读器；其他功能问题请补充相关设置、界面状态和问题发生前的操作。
          placeholder: 例如：相关页面链接、导出格式、设置状态或问题发生前的操作

    - type: markdown
      attributes:
          value: |
              ## 日志与附件

    - type: textarea
      id: logs
      attributes:
          label: 相关日志
          description: 请粘贴下载面板或浏览器控制台中的相关日志，并移除敏感信息。内容会自动格式化为代码，无需添加反引号。
          render: shell

    - type: textarea
      id: screenshots
      attributes:
          label: 截图或补充信息
          description: 可将截图或录屏拖放到此处，或提供单个图片资源 URL。
