name: 功能建议
description: 建议新功能或改进现有行为
title: "[Feature]: "
labels:
    - enhancement
body:
    - type: markdown
      attributes:
          value: |
              感谢你提出功能建议。请重点说明要解决的问题和使用场景，具体实现方式可以在 Issue 中继续讨论。
              如果现有功能没有按预期工作，请改用 Bug 反馈模板。
              请勿上传完整小说内容、登录信息、Cookie、访问令牌或其他敏感数据。

    - type: checkboxes
      id: checks
      attributes:
          label: 提交前确认
          options:
              - label: 我已搜索过现有 Issue，没有发现重复需求。
                required: true
              - label: 这是功能或改进建议，而不是 Bug 反馈或使用求助。
                required: true
              - label: 我已移除敏感信息和受版权保护的完整内容。
                required: true

    - type: dropdown
      id: feature_area
      attributes:
          label: 功能范围
          description: 请选择最接近的功能范围。
          options:
              - 下载流程
              - 导出格式
              - 正文图片
              - 缓存与恢复
              - 下载记录
              - 设置与界面
              - 页面或站点兼容
              - 其他
      validations:
          required: true

    - type: textarea
      id: requirement_description
      attributes:
          label: 需求描述
          description: 请说明使用场景、当前限制和期望效果。尽量描述需要解决的问题，不必预先确定具体实现方式。
          placeholder: |
              使用场景：
              当前限制：
              期望效果：
      validations:
          required: true

    - type: textarea
      id: additional_context
      attributes:
          label: 补充信息
          description: 可补充替代方案、界面草图、类似工具、相关 Issue、截图，以及可能影响现有行为的信息。
