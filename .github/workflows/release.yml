name: Release UserScript

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Validate release tag and source branch
        id: release-meta
        shell: bash
        run: |
          set -euo pipefail

          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"

          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${package_version}. Expected ${expected_tag}."
            exit 1
          fi

          if [[ "${package_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)(\.[0-9]+)?$ ]]; then
            required_branch="dev"
            prerelease="true"
          elif [[ "${package_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            required_branch="main"
            prerelease="false"
          else
            echo "::error::Unsupported release version: ${package_version}. Use x.y.z or x.y.z-(alpha|beta|rc)[.n]."
            exit 1
          fi

          git fetch --no-tags origin "+refs/heads/${required_branch}:refs/remotes/origin/${required_branch}"
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "refs/remotes/origin/${required_branch}"; then
            echo "::error::Tag ${GITHUB_REF_NAME} must point to a commit contained in ${required_branch}."
            exit 1
          fi

          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"
          echo "Release ${GITHUB_REF_NAME} validated against ${required_branch}."

      - name: Install Dependencies
        run: npm ci

      - name: Check and Build UserScript
        run: npm run build

      - name: Create Release & Upload Asset
        uses: softprops/action-gh-release@v1
        with:
          files: dist/esj-novel-downloader.user.js
          generate_release_notes: true
          prerelease: ${{ steps.release-meta.outputs.prerelease }}
